name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: https://gitroast-ai-frontend.jnoorrattan.workers.dev
      API_GATEWAY_BASE_URL: https://gitroast-api-gateway-preview.jnoorrattan.workers.dev/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live
