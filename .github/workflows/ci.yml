name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run bundle:check

  card-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/card
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/card/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --config wrangler.toml --dry-run --outdir dist --env preview

  gateway-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:gateway
      - run: npm run gateway:check

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, card-worker, gateway-worker]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE_URL: https://gitroast-api-gateway-preview.jnoorrattan.workers.dev/api/v1
      NEXT_PUBLIC_CARD_BASE_URL: https://gitroast-card-preview.jnoorrattan.workers.dev/card
      NEXT_PUBLIC_SITE_URL: https://gitroast-ai-frontend.jnoorrattan.workers.dev
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      GATEWAY_SHARED_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure gateway secret
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: printf '%s' "$GATEWAY_SHARED_SECRET" | npx wrangler secret put GATEWAY_SHARED_SECRET --config workers/gateway/wrangler.toml --env preview
      - name: Deploy API gateway Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: npx wrangler deploy --config workers/gateway/wrangler.toml --env preview
      - name: Deploy frontend Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: npm run deploy
      - name: Configure card Worker secret
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: printf '%s' "$GATEWAY_SHARED_SECRET" | npx wrangler secret put GATEWAY_SHARED_SECRET --config workers/card/wrangler.toml --env preview
      - name: Install card Worker dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: npm ci
        working-directory: workers/card
      - name: Deploy card Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != ''
        run: npm run deploy:preview
        working-directory: workers/card
      - name: Deploy Render backend after edge gateway cutover
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GATEWAY_SHARED_SECRET != '' && env.RENDER_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.GATEWAY_SHARED_SECRET == '' || env.RENDER_DEPLOY_HOOK == ''
        run: echo "::warning::Ordered release skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GATEWAY_SHARED_SECRET, and RENDER_DEPLOY_HOOK to the production environment."
